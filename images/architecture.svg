<title id="t">HYDRA-UMC-JOB-DISPATCHER architecture</title>
<desc id="d">HYDRA-UMC-JOB-DISPATCHER keeps a global queue of jobs, orders it by priority and hands each job to a robot that registered the tool the job names. Jobs have stages with dependencies and a duplicate-proof submission key; a robot that falls silent stops receiving work. The queue lives in memory or, with -db, in a pure-Go SQLite file. The HTTP surface needs a Bearer token outside the loopback address.</desc>
